<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>DSH 加工车间 · 动画</title>
<style>
:root{--bg:#0a0d12;--panel:#11161f;--line:#22303f;--text:#e8eaed;--dim:#93a1b5;--accent:#ffb547}
*{box-sizing:border-box}
body{margin:0;background:#0a0d12;color:#e8eaed;font:14px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid #22303f}
h1{font-size:17px;margin:0}
.ctrl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,button{background:#172130;color:#e8eaed;border:1px solid #2b3d52;border-radius:6px;padding:5px 9px;font-size:12.5px}
button{cursor:pointer}button:hover{border-color:#ffb547}
#wrap{display:grid;grid-template-columns:1fr 330px;gap:12px;padding:12px 18px 18px}
#stage{position:relative;background:#0d1219;border:1px solid #22303f;border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
#panel{background:#11161f;border:1px solid #22303f;border-radius:10px;padding:10px 12px;height:620px;overflow:auto}
#panel h2{font-size:12.5px;margin:0 0 8px;color:#ffd08a}
.step{padding:5px 7px;border-left:2px solid #26374a;margin:3px 0;font-size:11.5px;color:#b9c6d6;cursor:pointer}
.step.cur{border-left-color:#ffb547;background:#18212e;color:#fff}
.step .k{color:#ffc978;font-size:10px;margin-right:5px;font-family:ui-monospace,monospace}
#hint{color:#93a1b5;font-size:11.5px;padding:0 18px 14px}
</style></head><body>
<header><h1>DSH 加工车间</h1>
  <div class="ctrl">
    <select id="sess"></select>
    <button id="theme">🏭 工厂</button>
    <button id="play">▶ 播放</button>
    <button id="next">⏭ 下一步</button>
    <button id="speed">速度 1x</button>
    <span id="meta" style="color:#93a1b5;font-size:11.5px">--</span>
  </div>
</header>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="1200" height="620"></canvas></div>
  <aside id="panel"><h2>加工步骤</h2><div id="steps"></div></aside>
</div>
<div id="hint">箱子（你的消息）从左边进厂，工人把它搬到各个车间加工：规则注入 → 路由台挑工具 → 技能库/工具车间/模型引擎，最后打包出厂。数据来自真实会话事件。</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=cv.width, H=cv.height;
const el=id=>document.getElementById(id);
// ── 车间工位（x 为左边界，y 为地面线）──────────────
const ST=[
 {id:'intake', name:'① 输入口',   x:30,  y:500, w:140, h:120, kind:'dock'},
 {id:'inject', name:'② 规则注入', x:200, y:500, w:140, h:130, kind:'archive'},
 {id:'route',  name:'③ 路由台',   x:370, y:500, w:140, h:120, kind:'switch'},
 {id:'skills', name:'④ 技能库',   x:540, y:300, w:150, h:140, kind:'shelf'},
 {id:'tool',   name:'⑤ 工具车间', x:540, y:500, w:150, h:130, kind:'bench'},
 {id:'mcp',    name:'⑥ MCP 门',   x:720, y:300, w:140, h:140, kind:'portal'},
 {id:'gather', name:'⑦ 结果回收', x:720, y:500, w:140, h:120, kind:'bin'},
 {id:'think',  name:'⑧ 模型引擎', x:900, y:330, w:170, h:170, kind:'engine'},
 {id:'output', name:'⑨ 输出口',   x:1080,y:330, w:110, h:170, kind:'pack'},
];
const STBY=Object.fromEntries(ST.map(s=>[s.id,s]));
const ORDER=['intake','inject','route','skills','tool','mcp','gather','think','output'];
const COL={factory:{sky:'#0f1620',wall:'#1a2330',floor:'#2a2118',belt:'#3a2c1f',beltLine:'#5a4630',metal:'#4a5a6b',accent:'#ffb547',ok:'#7fd18a',crate:'#c9a06a',crateDark:'#6b4d2a'},water:{sky:'#08151f',wall:'#0e2433',floor:'#102a3a',belt:'#14405c',beltLine:'#2e7aa8',metal:'#3a6b8a',accent:'#6fc3ff',ok:'#7fe0c8',crate:'#8fd3ff',crateDark:'#2e6ea8'}};
let theme='factory', T=0, speed=1, playing=false, curStep=-1, data=null;
const workers=[{x:180,dir:1,phase:0,tx:null},{x:520,dir:-1,phase:1,tx:null},{x:760,dir:1,phase:2,tx:null}];
const particles=[], crates=[];
function rr(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}
function panelRect(x,y,w,h,base,edge){rr(x,y,w,h,base);rr(x,y,w,4,edge);rr(x,y+h-4,w,4,'#0b0f14');}
function workerSprite(w,pal,active){
  const bx=w.x, by=560, bob=Math.sin(T*8+w.phase)*1.5;
  const leg=Math.sin(T*10+w.phase)>0?1:-1;
  rr(bx-5,by-26+bob,10,12,pal.body);        // 身体
  rr(bx-4,by-38+bob,8,9,pal.skin);          // 头
  rr(bx-4,by-40+bob,8,3,'#2b2b2b');         // 帽
  rr(bx-7,by-14+bob,4,10,leg>0?pal.leg:pal.leg2); // 腿
  rr(bx+3,by-14+bob,4,10,leg>0?pal.leg2:pal.leg);
  if(active){rr(bx+6,by-24+bob,5,4,pal.accent);}  // 手里的箱子
}
const WPAL=[{body:'#4f7cff',skin:'#e8b48a',leg:'#2b3a55',leg2:'#223049',accent:'#ffb547'},
            {body:'#7f5bd6',skin:'#d9a06a',leg:'#3a2b55',leg2:'#2b2040',accent:'#ffb547'},
            {body:'#3f9d6b',skin:'#e0b48a',leg:'#22402f',leg2:'#1a3226',accent:'#ffb547'}];
function smoke(x,y){if(Math.random()<0.3)particles.push({x,y,vx:(Math.random()-.5)*0.4,vy:-0.5-Math.random()*0.6,life:60,c:'rgba(180,190,200,'});}
function spark(x,y){if(Math.random()<0.5)particles.push({x,y,vx:(Math.random()-.5)*1.6,vy:-Math.random()*1.4,life:18,c:'rgba(255,196,80,'});}
function drawStation(s,active,pal){
  const x=s.x,y=s.y-s.h,w=s.w,h=s.h;
  // 建筑主体
  panelRect(x,y,w,h,pal.wall,'#2b3d52');
  // 屋顶锯齿
  for(let i=0;i<w;i+=24){rr(x+i,y-8,12,8,'#253346');}
  // 名称
  ctx.fillStyle='#cfe0ff';ctx.font='12px ui-monospace,Consolas,monospace';
  ctx.fillText(s.name,x+8,y+18);
  if(active){ctx.strokeStyle=pal.accent;ctx.lineWidth=3;ctx.strokeRect(x-3,y-3,w+6,h+6);}
  const cx=x+w/2, cy=y+h/2;
  if(s.kind==='dock'){ // 装卸台
    rr(x+12,y+h-28,w-24,10,pal.metal);rr(x+20,y+h-40,26,12,pal.crate);
    rr(x+w-52,y+h-46,30,20,pal.metal);ctx.fillStyle=pal.accent;ctx.fillRect(x+w-46,y+h-40+(Math.sin(T*4)>0?0:4),18,4);
  } else if(s.kind==='archive'){ // 档案柜
    for(let i=0;i<3;i++){rr(x+14+i*40,y+34,32,42,pal.metal);rr(x+18+i*40,y+40,24,4,'#8fa1b8');}
    rr(x+14,y+h-26,w-28,8,pal.beltLine);
  } else if(s.kind==='switch'){ // 路由台：闪烁指示灯
    for(let i=0;i<6;i++){const on=Math.sin(T*6+i)>0;rr(x+18+i*20,y+40,12,10,on?pal.accent:'#22303f');}
    rr(x+14,y+h-30,w-28,12,pal.metal);
  } else if(s.kind==='shelf'){ // 技能库：书架（命中时扫描）
    if(active){const bx=x+14+((T*90)% (w-40));rr(bx,y+24,3,h-44,'rgba(255,214,120,.85)');}
    for(let row=0;row<3;row++){rr(x+10,y+34+row*30,w-20,3,'#5a4630');
      for(let i=0;i<9;i++){rr(x+14+i*14,y+22+row*30,9,12,['#7fd18a','#ffb547','#6fc3ff','#d67fd1'][(i+row)%4]);}}
  } else if(s.kind==='bench'){ // 工具车间：火花
    rr(x+16,y+h-34,w-32,12,pal.metal);rr(cx-6,y+h-46,12,12,'#8fa1b8');
    if(active)spark(cx,y+h-46);
  } else if(s.kind==='portal'){ // MCP 门
    rr(cx-24,y+34,48,70,'#0b0f14');rr(cx-20,y+38,40,62,pal.accent);
    const pulse=Math.sin(T*3)*0.5+0.5;ctx.globalAlpha=0.35+pulse*0.4;rr(cx-20,y+38,40,62,'#ffffff');ctx.globalAlpha=1;
  } else if(s.kind==='bin'){ // 回收箱
    rr(x+16,y+h-46,w-32,34,pal.crate);rr(x+16,y+h-46,w-32,6,pal.crateDark);
  } else if(s.kind==='engine'){ // 模型引擎：活塞+烟+核心
    const glow=0.4+0.3*Math.sin(T*4);
    ctx.fillStyle='rgba(255,181,71,'+glow.toFixed(2)+')';ctx.fillRect(x+16,y+34,w-32,10);
    rr(x+20,y+40,w-40,60,pal.metal);
    const p=Math.sin(T*5)>0?0:10;rr(x+w/2-10,y+30+p,20,24,'#8fa1b8');
    rr(x+20,y+110,30,30,'#2b3d52');rr(x+w-50,y+110,30,30,'#2b3d52');
    if(active)smoke(cx,y+20);
    // 齿轮
    const gx=x+w-34, gy=y+40;
    ctx.save();ctx.translate(gx,gy);ctx.rotate(T*2);ctx.fillStyle=pal.accent;ctx.fillRect(-8,-8,16,16);ctx.restore();
  } else if(s.kind==='pack'){ // 输出口
    rr(x+16,y+h-38,w-32,20,pal.beltLine);
    for(let i=0;i<3;i++)rr(x+24+i*30,y+h-54,18,14,pal.crate);
  }
}
function belt(){
  const pal=COL[theme];
  rr(0,556,W,64,pal.floor);
  rr(0,556,W,10,pal.belt);
  for(let i=-40;i<W;i+=40){const off=(T*60)%40;rr(i+off,570,24,6,pal.beltLine);}
  // 流水线轨道（浅色线示意路径）
  ctx.strokeStyle=theme==='water'?'rgba(111,195,255,.25)':'rgba(255,181,71,.18)';
  ctx.lineWidth=2;ctx.beginPath();
  for(const id of ORDER){const s=STBY[id];ctx.lineTo(s.x+s.w/2,s.y+8);}
  ctx.stroke();
}
let cratePos=null;
function drawCrate(s,active){
  // 空闲箱子：传送带上循环流动
  for(let i=0;i<6;i++){
    const bx=((T*40+i*200)%1240)-20;
    rr(bx,536,16,12,COL[theme].crate);rr(bx,536,16,3,COL[theme].crateDark);
  }
  if(!s)return;
  const tx=s.x+s.w/2, ty=540;
  if(!cratePos)cratePos={x:tx,y:ty};
  cratePos.x+=(tx-cratePos.x)*0.06*speed;
  cratePos.y+=(ty-cratePos.y)*0.06*speed;
  const x=cratePos.x,y=cratePos.y;
  rr(x-11,y-18,22,18,COL[theme].crate);rr(x-11,y-18,22,3,COL[theme].crateDark);
  rr(x-2,y-18,3,18,'#0b0f14');
  if(active){ctx.fillStyle='rgba(255,181,71,.25)';ctx.fillRect(x-16,y-24,32,26);}
}
function frame(){
  T+=0.016*speed;
  const pal=COL[theme];
  rr(0,0,W,H,pal.sky);
  // 背景墙网格
  for(let x=0;x<W;x+=48){rr(x,0,1,H,'rgba(255,255,255,.02)')}
  // 高窗与吊灯
  for(let i=0;i<8;i++){rr(60+i*140,40,70,34,'rgba(120,170,255,.07)');}
  for(let i=0;i<5;i++){const lx=140+i*230, sw=Math.sin(T*1.2+i)*3;
    rr(lx+sw,0,2,26,'#2b3d52');rr(lx-8+sw,26,18,6,'#ffd08a');}
  belt();
  const activeId=curStep>=0&&data?data.steps[curStep].station:null;
  for(const s of ST) drawStation(s,s.id===activeId,pal);
  // 工人走动（简单巡逻 + 搬箱子）
  workers.forEach((w,i)=>{
    const target=activeId&&STBY[activeId]?STBY[activeId].x+STBY[activeId].w/2-40:200+i*260;
    if(Math.abs(target-w.x)>6){w.x+=Math.sign(target-w.x)*1.2*speed;w.dir=Math.sign(target-w.x);}
    workerSprite(w,WPAL[i],activeId&&Math.abs(target-w.x)<40);
  });
  drawCrate(activeId&&STBY[activeId],true);
  // 粒子（烟/火花）
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.fillStyle=p.c+' '+(p.life/60).toFixed(2)+')';ctx.fillRect(p.x|0,p.y|0,3,3);}
  // 气泡文字
  if(curStep>=0&&data){const s=data.steps[curStep];
    ctx.fillStyle='rgba(10,14,20,.85)';ctx.fillRect(20,14,W-40,30);
    ctx.fillStyle='#ffd08a';ctx.font='12px ui-monospace,Consolas,monospace';
    ctx.fillText('['+s.station+'] '+s.text.slice(0,88),32,34);}
  requestAnimationFrame(frame);
}
// ── 数据与播放 ───────────────────────────────
async function loadSessions(){const r=await fetch('/api/sessions');const j=await r.json();
  el('sess').innerHTML=(j.sessions||[]).map(s=>`<option value="${s.id}">${(s.title||s.id).slice(0,40)}</option>`).join('');}
async function loadSession(){const id=el('sess').value;if(!id)return;
  const r=await fetch('/api/session?id='+encodeURIComponent(id));data=await r.json();
  if(data.error){el('meta').textContent='读取失败';return;}
  el('meta').textContent=data.count+' 步';curStep=-1;renderSteps();}
function renderSteps(){const box=el('steps');if(!data){return;}
  box.innerHTML=data.steps.map((s,i)=>`<div class="step ${i===curStep?'cur':''}" data-i="${i}"><span class="k">${s.station}</span>${s.text}</div>`).join('');
  box.querySelectorAll('.step').forEach(n=>n.onclick=()=>{curStep=Number(n.dataset.i);renderSteps();});
  if(curStep>=0&&box.children[curStep])box.children[curStep].scrollIntoView({block:'nearest'});}
let timer=null;
function play(){if(!data)return;if(timer){clearInterval(timer);timer=null;el('play').textContent='▶ 播放';return;}
  el('play').textContent='⏸ 暂停';
  timer=setInterval(()=>{if(curStep>=data.steps.length-1){clearInterval(timer);timer=null;el('play').textContent='▶ 播放';return;}curStep++;renderSteps();},1600/speed);}
el('play').onclick=play;
el('next').onclick=()=>{curStep=Math.min((data?data.steps.length:1)-1,curStep+1);renderSteps();};
el('theme').onclick=()=>{theme=theme==='factory'?'water':'factory';el('theme').textContent=theme==='factory'?'🏭 工厂':'💧 水流';};
el('speed').onclick=()=>{speed=speed>=3?1:speed+1;el('speed').textContent='速度 '+speed+'x';};
el('sess').onchange=loadSession;
loadSessions().then(async()=>{await loadSession();const q=new URLSearchParams(location.search);
  if(q.get('theme')==='water'){theme='water';el('theme').textContent='💧 水流';}
  if(q.get('step')){curStep=Number(q.get('step'));renderSteps();}
  if(q.get('play')){play();}});
frame();
</script></body></html>
