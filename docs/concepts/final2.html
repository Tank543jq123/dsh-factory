<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f4efe6;font-family:ui-monospace,Menlo,monospace}
.win{width:1180px;margin:14px auto;background:#fbf8f2;border:1px solid #d8cfbd;border-radius:12px;overflow:hidden;box-shadow:0 16px 36px rgba(120,100,70,.16)}
.bar{display:flex;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid #d8cfbd;font-size:13px;font-weight:700}
.tag{font-size:11px;font-weight:400;color:#8a8071;border:1px solid #d8cfbd;border-radius:6px;padding:3px 8px;background:#fff}
.stage{position:relative;height:470px;background:radial-gradient(circle at 32% 12%,#fffdf8,#f5efe2 62%,#ece4d4)}
.belt{position:absolute;left:70px;top:300px;width:1010px;height:24px;background:#d9c8a8;border:1px solid #bfa981;border-radius:5px;overflow:hidden}
.roller{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:#efe3c8;border:1px solid #bfa981;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.box{position:absolute;top:-18px;width:26px;height:20px;background:#e8a33d;border:1.5px solid #a8761c;border-radius:3px;animation:travel 11s linear infinite}
.box:after{content:"";position:absolute;left:12px;top:0;width:2px;height:100%;background:#a8761c}
@keyframes travel{0%{left:8px}100%{left:960px}}
.dot{position:absolute;top:10px;width:6px;height:6px;border-radius:50%;background:#ffd27a;box-shadow:0 0 10px #ffcf6d;animation:flow 3.6s linear infinite}
@keyframes flow{0%{left:0;opacity:0}8%{opacity:1}92%{opacity:1}100%{left:1000px;opacity:0}}
.walk{position:absolute;width:16px;animation:walk 7s ease-in-out infinite}
.walk b{display:block;width:11px;height:11px;border-radius:50%;background:#e6c9a0;border:1px solid #a98a58;margin:0 auto}
.walk i{display:block;width:13px;height:17px;background:#8a6f4a;border-radius:3px;margin-top:1px}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(90px)}}
.cap{position:absolute;font-size:11px;color:#5f5443;background:rgba(255,252,244,.94);border:1px solid #ddd0b6;border-radius:5px;padding:3px 8px;white-space:nowrap;text-align:center}
.cap b{display:block;font-size:12px;color:#3b3227}
