<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>伪3D · 瀑布式分支产线</title>
<style>
html,body{margin:0;background:#080c12;color:#e8eaed;font:14px/1.6 -apple-system,"PingFang SC",sans-serif}
.wrap{padding:12px 16px}h1{font-size:15px;margin:0 0 4px}
.sub{color:#8fa1b8;font-size:12px;margin-bottom:8px}
canvas{width:100%;image-rendering:pixelated;border:1px solid #1f2b3b;border-radius:8px;background:#060a10}
.legend{color:#8fa1b8;font-size:11.5px;margin-top:6px}
</style></head><body><div class="wrap">
<h1>伪 3D（等距）· 瀑布式分支产线</h1>
<div class="sub">对话文字从左上流入 → 主线向右 → 到分岔口「瀑布式」下坠到各自的产线；每条线的处理单元形状不同，路由模块内部逻辑可见</div>
<canvas id="cv" width="1320" height="820"></canvas>
<div class="legend">主线：对话 → 规则 → 路由 → 模型 → 输出｜支线 A：技能库（找手册）｜支线 B：工具/MCP 调用｜支线 C：结果回收再汇入主线</div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=1320,H=820,TILE=22,OX=430,OY=190;
const iso=(x,y,z=0)=>({X:OX+(x-y)*TILE*0.87,Y:OY+(x+y)*TILE*0.5-z*TILE});
const C={bg:'#060a10',plat:'#16233a',skirt:'#0b1420',grid:'rgba(130,175,240,.06)',
 belt:'#2b3140',beltHi:'#3b4452',steel:'#3a4f6b',steelL:'#2b3c55',steelR:'#22304a',
 amber:'#ffb547',teal:'#4fd1c5',sky:'#6fc3ff',violet:'#b39ddb',green:'#8fd3a0',crate:'#c9a06a',crateD:'#7a5a30',
 text:'#e8eaed',dim:'#8fa1b8',paper:'#f0e6cf'};
function poly(p,c){ctx.fillStyle=c;ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q.X,q.Y):ctx.moveTo(q.X,q.Y));ctx.closePath();ctx.fill();}
function box(x,y,z,w,d,h,top,left,right,outline='rgba(4,8,14,.6)'){
  const P=(a,b,c)=>iso(x+a*w,y+b*d,z+c*h);
  poly([P(0,0,1),P(1,0,1),P(1,1,1),P(0,1,1)],top);
  poly([P(0,1,1),P(1,1,1),P(1,1,0),P(0,1,0)],left);
  poly([P(1,0,1),P(1,1,1),P(1,1,0),P(1,0,0)],right);
  ctx.strokeStyle=outline;ctx.lineWidth=1;
  ctx.beginPath();[P(0,0,1),P(1,0,1),P(1,1,1),P(0,1,1)].forEach((q,i)=>i?ctx.lineTo(q.X,q.Y):ctx.moveTo(q.X,q.Y));ctx.closePath();ctx.stroke();
}
function belt(x0,x1,y){
  for(let x=x0;x<x1;x+=1.6){
    poly([iso(x,y,0.15),iso(x+1.6,y,0.15),iso(x+1.6,y+2.6,0.15),iso(x,y+2.6,0.15)],
      (Math.floor(T*5+x)%4<2)?C.belt:C.beltHi);
  }
}
let T=0;
function txt(s,x,y,color,font='9px ui-monospace,monospace'){const q=iso(x,y,0);ctx.fillStyle=color;ctx.font=font;ctx.fillText(s,q.X,q.Y);}
// ── 各模块：形状不同 ─────────────────────────────
function mDock(x,y){ // 输入：带雨棚的装卸口
  box(x,y,0,2.4,2.4,0.6,C.steel,C.steelL,C.steelR);
  box(x+0.2,y+0.2,0.6,1.0,1.0,1.4,C.amber,'#a87a20','#c08c2a');
  box(x-0.2,y-0.2,2.0,2.8,2.8,0.2,C.steel,C.steelL,C.steelR);
}
function mRules(x,y){ // 规则：压印机（上下往复）
  box(x,y,0,2.6,2.2,0.8,C.steel,C.steelL,C.steelR);
  const ph=Math.sin(T*4)>0?-0.5:0.2;
  box(x+0.4,y+0.3,1.2+ph,1.8,1.6,0.6,C.violet,'#7b6a9c','#8b7aad');
  box(x+0.6,y+0.5,1.0,1.4,1.2,0.08,C.paper,'#cbbf9f','#d9cdaa');
}
function mRoute(x,y){ // 路由：内部可见的换轨台（3 条小轨 + 道岔）
  box(x,y,0,3.4,3.0,0.5,C.steel,C.steelL,C.steelR);
  for(let k=0;k<3;k++){ // 三条候选轨
    const yy=y+0.4+k*0.9;
    for(let i=0;i<5;i++)poly([iso(x+0.3+i*0.55,yy,0.55),iso(x+0.8+i*0.55,yy,0.55),iso(x+0.8+i*0.55,yy+0.3,0.55),iso(x+0.3+i*0.55,yy+0.3,0.55)],C.grid.replace('0.06','0.5'));
  }
  const pick=Math.floor((T*0.8)%3); // 道岔选择
  for(let k=0;k<3;k++){const q=iso(x+2.9,y+0.55+k*0.9,0.9);ctx.fillStyle=(k===pick)?C.amber:'#2a3440';ctx.fillRect(q.X-4,q.Y-4,8,8);}
  const q=iso(x+1.2,y+1.5,0.8);
  ctx.fillStyle=C.amber;ctx.beginPath();ctx.moveTo(q.X,q.Y-8);ctx.lineTo(q.X+7,q.Y+2);ctx.lineTo(q.X-7,q.Y+2);ctx.closePath();ctx.fill();
  box(x-0.2,y-0.2,1.2,3.8,3.4,0.25,C.steel,C.steelL,C.steelR); // 顶棚
}
function mShelf(x,y){ // 技能库：三级书架 + 扫描臂
  box(x,y,0,2.4,2.4,2.6,C.steel,C.steelL,C.steelR);
  for(let r=0;r<3;r++)for(let i=0;i<3;i++){
    const q=iso(x+0.4+i*0.7,y+0.1,0.6+r*0.7);
    ctx.fillStyle=[C.green,C.amber,C.sky][(i+r)%3];ctx.fillRect(q.X-3,q.Y-4,6,5);
  }
  const arm=Math.sin(T*2)*0.8;
  const q=iso(x+1.2+arm,y+1.2,2.2);ctx.fillStyle=C.teal;ctx.fillRect(q.X-2,q.Y-2,4,4);
}
function mPortal(x,y){ // MCP：传送门
  box(x,y,0,2.2,2.2,1.8,C.steel,C.steelL,C.steelR);
  const pulse=0.4+0.4*Math.sin(T*3);
  const q=iso(x+1.1,y+1.1,1.0);
  ctx.fillStyle=`rgba(111,195,255,${pulse.toFixed(2)})`;ctx.fillRect(q.X-8,q.Y-10,16,18);
  ctx.strokeStyle=C.sky;ctx.strokeRect(q.X-8,q.Y-10,16,18);
}
function mBench(x,y){ // 工具车间：台钳 + 火花
  box(x,y,0,2.6,2.2,1.0,C.steel,C.steelL,C.steelR);
  box(x+0.5,y+0.4,1.0,1.6,1.2,0.5,C.amber,'#a87a20','#c08c2a');
  if(Math.random()<0.4){const q=iso(x+1.3,y+1.0,1.6);ctx.fillStyle='#ffd08a';ctx.fillRect(q.X-1,q.Y-3,2,2);}
}
function mEngine(x,y){ // 模型：大引擎 + 齿轮 + 烟
  box(x,y,0,3.6,3.4,1.6,C.steel,C.steelL,C.steelR);
  box(x+0.5,y+0.5,1.6,2.6,2.4,0.8,C.violet,'#7b6a9c','#8b7aad');
  const ph=Math.sin(T*6)>0?0:0.35;
  box(x+1.4,y+1.4,2.2+ph,0.8,0.8,0.8,C.amber,'#a87a20','#c08c2a');
  const g=iso(x+3.0,y+0.6,1.9);
  ctx.fillStyle=C.amber;ctx.fillRect(g.X-4,g.Y-4,8,8);
}
function mBin(x,y){ // 回收：漏斗
  box(x,y,0,2.2,2.2,0.8,C.steel,C.steelL,C.steelR);
  const q=iso(x+1.1,y+1.1,1.1);
  ctx.fillStyle=C.crate;ctx.beginPath();ctx.moveTo(q.X-9,q.Y-6);ctx.lineTo(q.X+9,q.Y-6);ctx.lineTo(q.X+4,q.Y+6);ctx.lineTo(q.X-4,q.Y+6);ctx.closePath();ctx.fill();
}
function mPack(x,y){ // 输出：打包机
  box(x,y,0,2.4,2.2,1.2,C.steel,C.steelL,C.steelR);
  box(x+0.3,y+0.3,1.2,1.8,1.6,0.5,C.green,'#4f7a5f','#5f8a6f');
  const q=iso(x+1.2,y+1.1,1.9);ctx.fillStyle=C.crate;ctx.fillRect(q.X-4,q.Y-4,8,6);
}
function worker(x,y,carry){
  const q=iso(x,y,0);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(q.X,q.Y+2,6,3,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=C.steelL;ctx.fillRect(q.X-3,q.Y-15,6,11);
  ctx.fillStyle='#e8b48a';ctx.fillRect(q.X-2,q.Y-20,5,5);
  ctx.fillStyle=C.amber;ctx.fillRect(q.X-3,q.Y-21,7,2);
  if(carry){ctx.fillStyle=C.crate;ctx.fillRect(q.X+3,q.Y-17,7,6);}
}
function crate(x,y,label,tok,color){
  box(x,y,0.2,1.4,1.3,0.8,C.crate,C.crateD,'#8a6636');
  const q=iso(x+0.7,y+0.6,1.1);
  ctx.fillStyle=color;ctx.font='9px ui-monospace,monospace';ctx.fillText(tok,q.X-6,q.Y-6);
  ctx.fillStyle=C.text;ctx.font='9px ui-monospace,monospace';ctx.fillText(label,q.X-8,q.Y+5);
}
// ── 布局：主线 + 瀑布式支线 ─────────────────────
// 主线 y=0，x: 4(输入) 10(规则) 16(路由) 24(模型) 31(输出)
// 支线A y=6，从路由（x=16）下坠，x: 16(技能库) 23(汇总)
// 支线B y=12，从路由（x=20）下坠，x: 20(工具) 25(MCP) 30(仓库)
function frame(){
  T+=0.016;
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  // 平台
  poly([iso(0,0,0),iso(36,0,0),iso(36,16,0),iso(0,16,0)],C.plat);
  poly([iso(0,16,0),iso(36,16,0),iso(36,16.9,-0.4),iso(0,16.9,-0.4)],C.skirt);
  for(let x=0;x<=36;x+=3){const a=iso(x,0,0),b=iso(x,16,0);ctx.strokeStyle=C.grid;ctx.beginPath();ctx.moveTo(a.X,a.Y);ctx.lineTo(b.X,b.Y);ctx.stroke();}
  for(let y=0;y<=16;y+=2){const a=iso(0,y,0),b=iso(36,y,0);ctx.strokeStyle=C.grid;ctx.beginPath();ctx.moveTo(a.X,a.Y);ctx.lineTo(b.X,b.Y);ctx.stroke();}
  // 主传送带
  belt(3,33,0);
  // 支线带
  belt(16,30,6.2);
  belt(20,31,12.2);
  // 瀑布式下坠滑槽（从主线到支线，斜向下）
  function chute(x0,y0,x1,y1){
    const steps=14;
    for(let i=0;i<steps;i++){
      const t1=i/steps,t2=(i+1)/steps;
      const ax=x0+(x1-x0)*t1, ay=y0+(y1-y0)*t1, bx=x0+(x1-x0)*t2, by=y0+(y1-y0)*t2;
      poly([iso(ax,ay,0.3),iso(bx,by,0.3),iso(bx,by+1.2,0.3),iso(ax,ay+1.2,0.3)],'#22303f');
      ctx.strokeStyle='rgba(255,181,71,.25)';ctx.lineWidth=1;
      ctx.beginPath();const q1=iso(ax,ay+0.6,0.35),q2=iso(bx,by+0.6,0.35);ctx.moveTo(q1.X,q1.Y);ctx.lineTo(q2.X,q2.Y);ctx.stroke();
    }
  }
  chute(16,2.6,17,6.2);
  chute(20,2.6,21,12.2);
  // 汇入滑槽（支线回到主线）
  chute(30,7.8,31,3.2);
  chute(31,13.6,32,3.6);

  const items=[];
  items.push({k:4, f:()=>mDock(4,0)});
  items.push({k:10,f:()=>mRules(10,0)});
  items.push({k:16,f:()=>mRoute(16,0)});
  items.push({k:24,f:()=>mEngine(24,0)});
  items.push({k:31,f:()=>mPack(31,0)});
  items.push({k:16,f:()=>mShelf(16.5,6.2)});
  items.push({k:23,f:()=>mBin(23,6.2)});
  items.push({k:20,f:()=>mBench(20.5,12.2)});
  items.push({k:25,f:()=>mPortal(25,12.2)});
  items.push({k:30,f:()=>mBin(30,12.2)});
  // 流动的箱子：主线三段 + 支线
  const mk=(x,y,lab,tok,color)=>()=>crate(x,y,lab,tok,color);
  items.push({k:8, f:mk(8,0,'对话','1.2k',C.amber)});
  items.push({k:13,f:mk(13,0,'规则','0.6k',C.violet)});
  items.push({k:19,f:mk(19,0,'路由','0.2k',C.amber)});
  items.push({k:18,f:mk(18,6.4,'找手册','2.4k',C.green)});
  items.push({k:22,f:mk(22,12.4,'MCP','1.7k',C.sky)});
  items.push({k:27,f:mk(27,0,'推理','6.7k',C.violet)});
  items.push({k:29,f:mk(29,6.4,'命中','3.2k',C.green)});
  items.push({k:5, f:()=>worker(6,3.4,true)});
  items.push({k:21,f:()=>worker(21,3.4,false)});
  items.push({k:24,f:()=>worker(24,9.6,true)});
  items.push({k:26,f:()=>worker(26,15.6,true)});
  items.sort((a,b)=>a.k-b.k).forEach(it=>it.f());
  // 标题与图例
  ctx.fillStyle='rgba(6,10,16,.9)';ctx.fillRect(14,12,W-28,30);
  ctx.fillStyle=C.amber;ctx.font='12px ui-monospace,monospace';
  ctx.fillText('对话文字流入 → 规则 → 路由分岔（瀑布式）→ 技能库 / 工具·MCP 并行 → 模型 → 输出',26,32);
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
