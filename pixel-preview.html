<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>像素风静帧对比</title>
<style>
html,body{margin:0;background:#0a0e14;color:#e8eaed;font:14px/1.6 -apple-system,"PingFang SC",sans-serif}
.wrap{padding:16px 20px}
h1{font-size:16px;margin:0 0 4px}
.sub{color:#93a1b5;font-size:12px;margin-bottom:12px}
canvas{width:100%;max-width:1152px;image-rendering:pixelated;image-rendering:crisp-edges;border:1px solid #22303f;border-radius:6px;display:block}
</style></head><body><div class="wrap">
<h1>纯像素风 · 静帧对比</h1>
<div class="sub">384×216 低分辨率画布，16 色限定调色板，1px 硬描边，无渐变；与当前等距版对比用</div>
<canvas id="cv" width="384" height="216"></canvas>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=384,H=216;
// 16 色限定调色板
const P=['#0b0f16','#141c28','#1d2836','#26333f','#32424f','#3f5460','#54707c','#6b8c96',
         '#8fb3a8','#c9d8a8','#e8d49b','#f2b95c','#e08b42','#a85f3a','#6f4a35','#ffffff'];
const TILE=9, OX=W/2-30, OY=52;
const iso=(x,y,z=0)=>({X:OX+(x-y)*TILE*0.87|0, Y:OY+(x+y)*TILE*0.5-z*TILE|0});
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.X,p.Y):ctx.moveTo(p.X,p.Y));ctx.closePath();ctx.fill();}
function box(x,y,z,w,d,h,top,left,right){
  const p=(a,b,c)=>iso(x+a*w,y+b*d,z+c*h);
  poly([p(0,0,1),p(1,0,1),p(1,1,1),p(0,1,1)],top);
  poly([p(0,1,1),p(1,1,1),p(1,1,0),p(0,1,0)],left);
  poly([p(1,0,1),p(1,1,1),p(1,1,0),p(1,0,0)],right);
  // 1px 描边
  ctx.strokeStyle=P[0];ctx.lineWidth=1;
  ctx.beginPath();[p(0,0,1),p(1,0,1),p(1,1,1),p(0,1,1)].forEach((q,i)=>i?ctx.lineTo(q.X,q.Y):ctx.moveTo(q.X,q.Y));ctx.closePath();ctx.stroke();
}
const ST=[
 {x:1,y:9,w:3,d:3,h:1.2,kind:'dock'},{x:6,y:9,w:3,d:3,h:1.6,kind:'arch'},
 {x:11,y:9,w:3,d:3,h:1.4,kind:'route'},{x:16,y:3,w:3,d:4,h:2.0,kind:'shelf'},
 {x:16,y:9,w:3,d:3,h:1.5,kind:'bench'},{x:21,y:3,w:3,d:3,h:1.9,kind:'mcp'},
 {x:21,y:9,w:3,d:3,h:1.1,kind:'bin'},{x:26,y:9,w:4,d:4,h:2.6,kind:'engine'},
 {x:26,y:3,w:3,d:3,h:1.4,kind:'pack'},
];
function draw(){
  ctx.fillStyle=P[0];ctx.fillRect(0,0,W,H);
  // 平台
  const L=0,R=32,B=16;
  poly([iso(L,B,0),iso(R,B,0),iso(R,B+0.6,-0.3),iso(L,B+0.6,-0.3)],P[2]);
  poly([iso(R,L,0),iso(R+0.6,L,0),iso(R+0.6,B,-0.3),iso(R,B,-0.3)],P[1]);
  poly([iso(L,L,0),iso(R,L,0),iso(R,B,0),iso(L,B,0)],P[3]);
  // 地砖（隔行，硬像素）
  for(let x=L;x<R;x+=2)for(let y=L;y<B;y+=2){poly([iso(x,y,0),iso(x+1,y,0),iso(x+1,y+1,0),iso(x,y+1,0)],P[2]);}
  // 传送带
  for(let x=0;x<30;x++){poly([iso(x,13,0),iso(x+1,13,0),iso(x+1,14,0),iso(x,14,0)],(x%2?P[5]:P[4]));}
  const sorted=[...ST].sort((a,b)=>(a.x+a.y+a.w)-(b.x+b.y+b.w));
  const BODY={dock:[P[6],P[5]],arch:[P[7],P[6]],route:[P[6],P[5]],shelf:[P[9],P[8]],
              bench:[P[10],P[9]],mcp:[P[7],P[6]],bin:[P[12],P[11]],engine:[P[7],P[6]],pack:[P[9],P[8]]};
  for(const s of sorted){
    const [bt,bs]=BODY[s.kind]||[P[7],P[6]];
    box(s.x,s.y,0,s.w,s.d,s.h,bt,bs,P[4]);
    // 屋顶：深色瓦 + 1px 亮边
    box(s.x-0.08,s.y-0.08,s.h,s.w+0.16,s.d+0.16,0.14,P[6],P[4],P[3]);
    const c=iso(s.x+s.w/2,s.y+s.d/2,s.h);
    if(s.kind==='shelf'){for(let i=0;i<3;i++){const q=iso(s.x+0.5+i,s.y+0.4,s.h*0.5);ctx.fillStyle=[P[9],P[11],P[8]][i];ctx.fillRect(q.X-4,q.Y-6,8,6);}}
    if(s.kind==='route'){for(let i=0;i<3;i++){const q=iso(s.x+0.5+i,s.y+0.6,s.h*0.7);ctx.fillStyle=i===1?P[11]:P[6];ctx.fillRect(q.X-2,q.Y-3,5,4);}}
    if(s.kind==='bench'){const q=iso(s.x+1.2,s.y+1.2,s.h*0.4);ctx.fillStyle=P[12];ctx.fillRect(q.X-4,q.Y-4,8,5);}
    if(s.kind==='mcp'){const q=iso(s.x+1.2,s.y+1.2,s.h*0.45);ctx.fillStyle=P[8];ctx.fillRect(q.X-5,q.Y-8,10,14);}
    if(s.kind==='engine'){const q=iso(s.x+2,s.y+2,s.h*0.6);ctx.fillStyle=P[11];ctx.fillRect(q.X-6,q.Y-8,12,10);ctx.fillStyle=P[12];ctx.fillRect(q.X-3,q.Y-12,6,4);}
    if(s.kind==='bin'){const q=iso(s.x+1.2,s.y+1.2,s.h*0.3);ctx.fillStyle=P[14];ctx.fillRect(q.X-6,q.Y-6,12,8);}
    if(s.kind==='pack'){const q=iso(s.x+1,s.y+0.6,s.h*0.35);ctx.fillStyle=P[14];ctx.fillRect(q.X-6,q.Y-5,7,6);ctx.fillRect(q.X+1,q.Y-5,7,6);}
    if(s.kind==='dock'){const q=iso(s.x+1.2,s.y+1.2,s.h*0.25);ctx.fillStyle=P[14];ctx.fillRect(q.X-6,q.Y-6,12,6);}
  }
  // 工人（8×14 像素小人，走路帧）
  function worker(x,y,f,carry){
    const q=iso(x,y,0);
    ctx.fillStyle=P[0];ctx.fillRect(q.X-4,q.Y+1,9,2);            // 影子
    ctx.fillStyle=P[13];ctx.fillRect(q.X-3,q.Y-12,6,8);          // 身体
    ctx.fillStyle=P[12];ctx.fillRect(q.X-2,q.Y-16,5,5);          // 头
    ctx.fillStyle=P[11];ctx.fillRect(q.X-3,q.Y-17,7,2);          // 安全帽
    ctx.fillStyle=P[1];ctx.fillRect(q.X-3,q.Y-4,2,4);ctx.fillRect(q.X+1,q.Y-4,2,4); // 腿
    if(carry){ctx.fillStyle=P[14];ctx.fillRect(q.X+3,q.Y-14,6,5);}
  }
  worker(5,12,0,true); worker(13,12,1,false); worker(24,12,2,true);
  // 箱子
  const bx=iso(12,13.2,0);ctx.fillStyle=P[14];ctx.fillRect(bx.X-3,bx.Y-6,7,6);ctx.fillStyle=P[15];ctx.fillRect(bx.X-3,bx.Y-6,7,1);
  // 边框
  ctx.strokeStyle=P[1];ctx.strokeRect(0.5,0.5,W-1,H-1);
}
draw();
</script></body></html>
