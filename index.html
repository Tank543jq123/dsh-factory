<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>DSH 工厂 · 架构与调度</title>
<style>
:root{--bg:#0b0e13;--panel:#131822;--line:#243043;--text:#e8eaed;--dim:#93a1b5;--accent:#5b9cff;--ok:#3fb950;--warn:#f0b542}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 30% 0%,#101826,#0b0e13 60%);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","PingFang SC",sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:18px 24px 6px}
h1{font-size:20px;margin:0}
.sub{color:var(--dim);font-size:12px}
.wrap{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:8px 20px 24px}
.floor{position:relative;background:linear-gradient(180deg,#0f1520,#0c111a);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:640px}
.floor svg{width:100%;height:100%;display:block}
.ws{cursor:pointer}
.ws rect.body{fill:#151d2a;stroke:#2a3a52;stroke-width:1.2;rx:10}
.ws:hover rect.body{stroke:var(--accent)}
.ws .name{fill:#e8eaed;font-size:13px;font-weight:600}
.ws .role{fill:#8fa1b8;font-size:10.5px}
.ws .metric{fill:#9cc4ff;font-size:12px;font-weight:600}
.badge{font-size:9.5px;fill:#7fd18a}
.conv{fill:none;stroke:#2b3d57;stroke-width:2;stroke-dasharray:6 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.dot{fill:var(--accent);opacity:.9}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;height:640px;overflow:auto}
.panel h2{font-size:14px;margin:0 0 8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.panel .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #1e2836;font-size:12.5px}
.panel .kv span:last-child{color:#9cc4ff}
.panel ul{margin:6px 0 0;padding-left:18px}
.panel li{margin:4px 0;font-size:12.5px;color:#c8d2e0}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border:1px solid #3a5a3a;border-radius:999px;color:#7fd18a;margin-left:6px}
.err{color:#ff9b93;font-size:12px;padding:0 24px}
.legend{color:var(--dim);font-size:11.5px;padding:0 24px 14px}
</style></head><body>
<header><h1>DSH 工厂</h1><span class="sub">以 Agent 架构为蓝图的车间视图 · 数据只读 · <span id="ts">--</span></span></header>
<div class="wrap">
  <div class="floor" id="floor">
    <svg viewBox="0 0 1080 640" id="svg" aria-label="工厂布局"></svg>
  </div>
  <aside class="panel" id="panel">
    <h2>车间说明</h2>
    <p style="color:#93a1b5;font-size:12.5px">点击左侧任一车间，查看它当前的实例：这里有什么、由谁调度、用户能不能改。</p>
    <div class="legend">流水线：输入 → 路由 → 技能 / MCP / 工具 → 模型 → 输出</div>
  </aside>
</div>
<div class="err" id="err"></div>
<div class="legend">每个车间都是真实数据：技能来自 ~/.dsh/skills，工具来自 profile 的 bundle 清单，调度来自 schedule.json，工单来自 SuperAgent 的 orchestrator.sqlite。</div>
<script>
const NS='http://www.w3.org/2000/svg';
const W=[
 {id:'intake', x:40,y:270,w:150,h:100,name:'① 输入', role:'会话 / 工单 / 定时', mut:true},
 {id:'routing',x:260,y:270,w:170,h:100,name:'② 路由与调度',role:'谁来做、什么时候做',mut:true},
 {id:'skills', x:520,y:90, w:170,h:100,name:'③ 技能车间',role:'指导手册 / 规则',mut:true},
 {id:'mcp',    x:520,y:270,w:170,h:100,name:'④ MCP 车间',role:'对外接口',mut:true},
 {id:'tools',  x:520,y:450,w:170,h:100,name:'⑤ 工具车间',role:'内置/插件工具',mut:true},
 {id:'memory', x:260,y:460,w:170,h:90,name:'⑧ 记忆·书阁',role:'长期经验库',mut:true},
 {id:'model',  x:770,y:270,w:160,h:100,name:'⑥ 模型车间',role:'provider / model',mut:true},
 {id:'output', x:960,y:270,w:100,h:100,name:'⑦ 输出', role:'回答/交付',mut:false},
];
const LINKS=[['intake','routing'],['routing','memory'],['memory','model'],['routing','skills'],['routing','mcp'],['routing','tools'],['skills','model'],['mcp','model'],['tools','model'],['model','output']];
const el=id=>document.getElementById(id);
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
let data=null;
function center(w){return {x:w.x+w.w/2,y:w.y+w.h/2};}
function draw(){
  const svg=el('svg'); svg.innerHTML='';
  const defs=mk('defs',{},svg);
  // 地面网格
  for(let x=0;x<=1080;x+=60) mk('line',{x1:x,y1:0,x2:x,y2:640,stroke:'#131a26','stroke-width':1},svg);
  for(let y=0;y<=640;y+=60) mk('line',{x1:0,y1:y,x2:1080,y2:y,stroke:'#131a26','stroke-width':1},svg);
  // 连线
  for(const [a,b] of LINKS){
    const A=W.find(w=>w.id===a), B=W.find(w=>w.id===b);
    const p1=center(A), p2=center(B);
    const midX=(p1.x+p2.x)/2;
    const d=`M${p1.x},${p1.y} C${midX},${p1.y} ${midX},${p2.y} ${p2.x},${p2.y}`;
    mk('path',{d,class:'conv'},svg);
    // 流动的小点
    const dot=mk('circle',{r:3.2,class:'dot'},svg);
    const act=(data&&data.workshops&&data.workshops.routing&&data.workshops.routing.tickets&&data.workshops.routing.tickets.triggers24h)||1;
    const dur=Math.max(0.8, 6 - Math.min(4, act/40)).toFixed(1)+'s';
    const am=mk('animateMotion',{dur,repeatCount:'indefinite',path:d},dot);
  }
  // 车间
  const counts=countsOf();
  for(const w of W){
    const g=mk('g',{class:'ws'},svg);
    mk('rect',{class:'body',x:w.x,y:w.y,width:w.w,height:w.h,rx:10},g);
    mk('rect',{x:w.x,y:w.y,width:4,height:w.h,fill:'#5b9cff',opacity:.8,rx:2},g);
    mk('text',{class:'name',x:w.x+16,y:w.y+28},g).textContent=w.name;
    mk('text',{class:'role',x:w.x+16,y:w.y+48},g).textContent=w.role;
    mk('text',{class:'metric',x:w.x+16,y:w.y+78},g).textContent=counts[w.id]||'—';
    if(w.mut) mk('text',{class:'badge',x:w.x+16,y:w.y+94},g).textContent='可改';
    g.addEventListener('click',()=>show(w.id));
  }
  el('ts').textContent=data?data.generatedAt:'--';
}
function countsOf(){
  const w=data&&data.workshops; if(!w) return {};
  const t=w.routing&&w.routing.tickets||{};
  return {
    intake: (t.triggers24h||0)+' 次触发 / 24h',
    routing: (t.tickets||0)+' 工单 · '+(w.routing&&w.routing.schedules?w.routing.schedules.length:0)+' 定时',
    skills: (w.skills&&w.skills.items?w.skills.items.length:0)+' 个技能',
    mcp: (w.mcp&&w.mcp.items?w.mcp.items.length:0)+' 个 MCP',
    tools: (w.tools&&w.tools.profiles?w.tools.profiles.reduce((a,p)=>a+p.bundles.length,0):0)+' 个插件',
    memory: (w.memory&&w.memory.entries!=null?w.memory.entries:0)+' 条经验',
    model: (w.model&&w.model.providers?w.model.providers.length:0)+' 个 provider',
    output: '交付 / 回答',
  };
}
function show(id){
  const w=data&&data.workshops; const p=el('panel');
  const titles={intake:'① 输入口',routing:'② 路由与调度车间',skills:'③ 技能车间',mcp:'④ MCP 车间',tools:'⑤ 工具车间',memory:'⑧ 记忆·书阁',model:'⑥ 模型车间',output:'⑦ 输出口'};
  let h=`<h2>${titles[id]||id}</h2>`;
  if(!w){p.innerHTML=h+'<p class="tag">加载中…</p>';return;}
  if(id==='routing'){
    const t=w.routing.tickets||{}; const s=w.routing.schedules||[];
    h+=`<div class="kv"><span>工单总数</span><span>${t.tickets||0}</span></div>
        <div class="kv"><span>24h 触发</span><span>${t.triggers24h||0}</span></div>
        <div class="kv"><span>订阅线程</span><span>${t.threads||0}</span></div>
        <h2 style="margin-top:14px">定时任务（可改：~/.dsh/storages/schedule.json）</h2><ul>${s.map(x=>`<li>${x.title||'?'} · ${x.time||''} · ${x.status||''}</li>`).join('')||'<li>无</li>'}</ul>`;
  } else if(id==='skills'){
    const items=(w.skills&&w.skills.items)||[];
    h+=`<div class="kv"><span>已装技能</span><span>${items.length}</span></div><h2 style="margin-top:14px">技能目录：~/.dsh/skills</h2><ul>${items.map(i=>`<li><b>${i.name}</b>${i.desc?' — '+i.desc:''}</li>`).join('')||'<li>无</li>'}</ul>`;
  } else if(id==='mcp'){
    const items=(w.mcp&&w.mcp.items)||[];
    h+=`<div class="kv"><span>已配置 MCP</span><span>${items.length}</span></div><p style="color:#f0b542;font-size:12.5px">${(w.mcp&&w.mcp.note)||''}</p><p style="color:#93a1b5;font-size:12.5px">MCP 车间负责“对外接口”：数据库、云服务、第三方 API 等都可以挂成 MCP 服务器。当前未配置——在 DSH 的插件/MCP 设置里添加服务器后，这里会自动出现并参与调度。</p>`;
  } else if(id==='tools'){
    const profs=(w.tools&&w.tools.profiles)||[];
    h+=`<h2>按 profile 的插件（可改：profile 的 bundle 清单）</h2>`+profs.map(p=>`<div class="kv"><span>${p.profile}</span><span>${p.bundles.length} 个</span></div><ul>${p.bundles.map(b=>`<li>${b}</li>`).join('')}</ul>`).join('');
  } else if(id==='memory'){
    const m=w.memory||{};
    h+=`<div class="kv"><span>书库条目</span><span>${m.entries??'—'}</span></div><div class="kv"><span>已退役骨架</span><span>${m.retired??'—'}</span></div><div class="kv"><span>册数</span><span>${m.volumes??'—'}</span></div><p style="color:#93a1b5;font-size:12.5px">${m.root||''}</p>`;
  } else if(id==='model'){
    const pv=(w.model&&w.model.providers)||[];
    h+=`<h2>provider（可改：设置页 / .credentials.yaml）</h2><ul>${pv.map(x=>`<li>${x}</li>`).join('')||'<li>未检测到</li>'}</ul>`;
  } else if(id==='intake'){
    const t=(w.routing&&w.routing.tickets)||{};
    h+=`<div class="kv"><span>24h 触发</span><span>${t.triggers24h||0}</span></div><div class="kv"><span>当前工单</span><span>${t.tickets||0}</span></div><p style="color:#93a1b5;font-size:12.5px">输入来自：对话消息、工单线程、定时任务；由路由车间决定是新建工单、追加到已有工单，还是忽略。</p>`;
  } else {
    h+=`<p style="color:#93a1b5;font-size:12.5px">输出口负责把结果变成回答、报告、交付物或 IM 消息；具体投递通道由插件（微信/飞书/GitHub）决定。</p>`;
  }
  p.innerHTML=h;
}
async function tick(){
  try{
    const r=await fetch('/api/factory',{cache:'no-store'});
    data=await r.json(); el('err').textContent='';
    draw(); if(!el('panel').dataset.touched) show('routing');
  }catch(e){ el('err').textContent='数据加载失败：'+e.message; }
}
setInterval(tick,5000); tick();
el('panel').addEventListener('click',()=>{el('panel').dataset.touched='1';});
</script></body></html>
